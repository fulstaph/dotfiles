# Starship prompt config
# Docs: https://starship.rs/config/

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$cmd_duration\
$line_break\
$character"""

right_format = """$nodejs$python$rust$golang$java$docker_context"""

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold yellow)'

[directory]
style = 'bold blue'
truncation_length = 4
truncate_to_repo = true
read_only = ' 󰌾'

[git_branch]
symbol = ' '
style = 'bold purple'
format = 'on [$symbol$branch]($style) '

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold red'
conflicted = '='
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '$${count}'
modified = '!${count}'
staged = '+${count}'
deleted = '✘${count}'

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = 'bright-black'

[cmd_duration]
min_time = 2_000          # show if command took >2 s
format = 'took [$duration](bold yellow) '

[nodejs]
symbol = ' '
style = 'bold green'
format = '[$symbol($version )]($style)'

[python]
symbol = ' '
style = 'bold yellow'
format = '[$symbol($version )(\($virtualenv\) )]($style)'
detect_files = ['requirements.txt', 'pyproject.toml', '.python-version', 'Pipfile']

[rust]
symbol = '󱘗 '
style = 'bold red'
format = '[$symbol($version )]($style)'

[golang]
symbol = ' '
style = 'bold cyan'
format = '[$symbol($version )]($style)'

[java]
symbol = ' '
style = 'bold red'
format = '[$symbol($version )]($style)'

[docker_context]
symbol = ' '
style = 'bold blue'
format = '[$symbol$context]($style) '
only_with_files = true

[time]
disabled = true
