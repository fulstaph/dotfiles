name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate JSON configuration
        run: python3 -m json.tool lazyvim.json >/dev/null

      - name: Verify agent instructions link
        run: |
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"

      - name: Install Lua parser
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.4

      - name: Check Lua syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done < <(find . -type f -name '*.lua' -not -path './.git/*' -print0)

      - name: Check Lua formatting
        uses: JohnnyMorganz/stylua-action@v2
        with:
          version: v0.20.0
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --check .

  neovim-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Neovim
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/neovim/neovim/releases/download/stable/nvim-linux-x86_64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --version | head -n 1

      - name: Cache Lazy.nvim plugins
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nvim-data
          key: nvim-${{ runner.os }}-${{ hashFiles('lazy-lock.json') }}

      - name: Sync and boot configuration
        shell: bash
        run: |
          ci_config="$(mktemp -d)"
          ln -s "$GITHUB_WORKSPACE" "$ci_config/nvim"

          export XDG_CONFIG_HOME="$ci_config"
          export XDG_DATA_HOME="$RUNNER_TEMP/nvim-data"

          timeout --signal=TERM --kill-after=30s 10m \
            nvim --headless "+Lazy! sync" +qa
          timeout --signal=TERM --kill-after=30s 2m \
            nvim --headless +qa
