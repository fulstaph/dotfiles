name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Linux (containerised, matrix) ───────────────────────────────────────
  test-linux:
    name: zshrc — ${{ matrix.distro }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4
      - name: Test zshrc
        run: bash scripts/test-zshrc.sh

  # ── macOS ────────────────────────────────────────────────────────────────
  test-macos:
    name: zshrc — macos-latest
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test zshrc
        run: bash scripts/test-zshrc-mac.sh

  # ── Shellcheck (bash scripts only — install.zsh is zsh, excluded) ────────
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck setup.sh scripts/test-zshrc.sh scripts/test-zshrc-mac.sh test-linux.sh
