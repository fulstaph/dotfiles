name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-linux:
    name: zsh configuration — ${{ matrix.distro }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu:24.04
          - ubuntu:22.04
    container:
      image: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test zsh configuration
        run: |
          bash scripts/test-zshrc.sh
          zsh scripts/test-install.sh

  test-setup-platform:
    name: setup platform detection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test platform detection
        run: bash scripts/test-setup-platform.sh

  test-macos:
    name: zsh configuration — macos-15
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test zsh configuration
        run: |
          bash scripts/test-zshrc-mac.sh
          zsh scripts/test-install.sh

  verify-zellij-assets:
    name: zellij plugin checksums
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify vendored plugins
        run: cd zellij/plugins && sha256sum --check SHA256SUMS

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run shellcheck
        run: |
          shellcheck setup.sh \
            scripts/test-linux-container.sh \
            scripts/test-setup-platform.sh \
            scripts/test-zshrc.sh \
            scripts/test-zshrc-mac.sh
